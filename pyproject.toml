[project]
name = "gpuguesstimator"
version = "0.1.0"
description = "GPUguesstimator — a KV-cache–aware GPU sizing simulator for LLM serving (vLLM-friendly)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "gradio>=4.0.0",
  "pyyaml>=6.0.1",
  "huggingface_hub>=0.22.0",
  "requests>=2.31.0",
  "matplotlib>=3.7.0",
  "plotly>=5.0.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.5.0",
]

[tool.uv]
